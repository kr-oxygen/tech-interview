# Production stack: the app image (built elsewhere, see docs/self-hosting.md) and PostgreSQL.
# Usage, from a directory holding this file and .env.prod:
#   APP_TAG=<tag> docker compose -f docker-compose.prod.yml run --rm app migrate   # explicit step
#   APP_TAG=<tag> docker compose -f docker-compose.prod.yml up -d
# The app is published on loopback only; put a reverse proxy or tunnel in front of it.
name: tech-interview

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    # No `ports:` — the database is reachable only on this compose network.

  app:
    image: ${APP_IMAGE:-tech-interview}:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - '127.0.0.1:${APP_PORT:-3001}:3001'
    depends_on:
      db:
        condition: service_healthy
    init: true
    # Lets the app flush documents and snapshots on SIGTERM.
    stop_grace_period: 20s
    logging: *logging

volumes:
  pgdata:
